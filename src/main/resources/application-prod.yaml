# Profile production — kích hoạt bằng: SPRING_PROFILES_ACTIVE=prod
# Override các giá trị mặc định ở application.yaml

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

app:
  debug: false

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
