server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: medical-be

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/medical}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:true}

  messages:
    basename: lang/messages
    encoding: UTF-8
    fallback-to-system-locale: false
    use-code-as-default-message: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME:hoa25102020@gmail.com}
    password: ${SPRING_MAIL_PASSWORD:cfpkrmtifwivsuad}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com
        debug: ${MAIL_DEBUG:false}

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

ocr:
  api:
    url: ${OCR_API_URL:http://localhost:8000}

app:
  key: ${APP_KEY:ZGV2LWRlZmF1bHQtc2VjcmV0LWtleS0zMi1ieXRlcyE=}
  debug: ${APP_DEBUG:true}
  upload-dir: ${APP_UPLOAD_DIR:uploads/photos}
  server:
    url: ${APP_SERVER_URL:http://localhost:8080}
    description: Development Server

springdoc:
  swagger-ui:
    path: /documents/swagger-ui
  api-docs:
    path: /documents/api-docs
