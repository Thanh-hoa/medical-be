server:
  port: ${SERVER_PORT}

spring:
  application:
    name: medical-be

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}
    show-sql: ${JPA_SHOW_SQL}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL}

  messages:
    basename: lang/messages
    encoding: UTF-8
    fallback-to-system-locale: false
    use-code-as-default-message: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com
        debug: ${MAIL_DEBUG}

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

ocr:
  api:
    url: ${OCR_API_URL}

encryption:
  secret-key: ${ENCRYPTION_SECRET_KEY:}

app:
  key: ${APP_KEY}
  debug: ${APP_DEBUG}
  upload-dir: ${APP_UPLOAD_DIR}
  server:
    url: ${APP_SERVER_URL}
    description: Development Server

springdoc:
  swagger-ui:
    path: /documents/swagger-ui
  api-docs:
    path: /documents/api-docs
